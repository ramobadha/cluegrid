# Separate syncing service. The frontend remains on GitHub Pages.
services:
  - type: web
    runtime: python
    name: cluegrid-sync
    plan: free
    buildCommand: pip install -r requirements.txt && python build.py
    startCommand: gunicorn 'server:create_app()' --bind 0.0.0.0:$PORT --workers 1 --threads 8
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://ramobadha.github.io
      - key: ROOM_DB
        value: /tmp/cluegrid/rooms.sqlite3
